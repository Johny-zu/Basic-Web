<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Presentaciones</title>
</head>
<body>
    <div class="contenedor-formularios">
        <div class="formulario">
            <h2>Formulario</h2>
            <form action="">
                <br>
                <label for="nombre">Nombre: </label>
                <input type="text" name="nombre", id="nombreInput">
                <br><br>
                <label for="profesion">Profesion: </label>
                <input type="text" name="profesion" id="profesionInput">
                <br><br>
                <label for="email">Email: </label>
                <input type="text" id="emailInput" name="email">
                <br><br>
                <label for="telefono">Telefono: </label>
                <input type="text", id="telefonoInput" name="telefono">
                <br><br>
                <input type="button" value="Generar tarjeta" id="btnEnviar">
                <input type="reset" value="Restablecer" id="btnReset">
            </form>
        </div>
        <div class="formulario">
            <h2>Tarjeta</h2>
            <div id="resultadoDiv"></div>
        </div>
    </div>
    <script src="../JS/script.js"></script>
</body>
</html>
